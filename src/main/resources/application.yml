spring:
  application:
    name: Library
  profiles:
    active: test  # ✅ По умолчанию dev (измените на test/prod при необходимости)

  # === RabbitMQ ===
  rabbitmq:
    host: localhost
    port: 5672
    username: library
    password: library

  # === Mail (общий для всех профилей) ===
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# === Логирование (общее для всех профилей) ===
logging:
  file:
    name: ./logs/library-app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.apache.coyote.http11.Http11Processor: WARN
# === JWT (общий для всех профилей) ===
jwt:
  secret: "21K0Gom7u7W0QgeGzhNGiBGnhaE5LooZIzuoWz43SEOxQW5oBvTNk5K6RVThx9pxZY31AWLGHkVU5/ZsEJDeuQ=="
  expiration: 86400000              # 24 часа
  refresh-expiration: 604800000     # 7 дней

# === Bucket4j (общий) ===
bucket4j:
  enabled: true