spring:
  application:
    name: Library
  profiles:
    active: dev

# === Логирование (общее для всех профилей) ===
logging:
  file:
    name: ./logs/library-app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.apache.coyote.http11.Http11Processor: WARN
# === JWT (общий для всех профилей) ===
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000              # 24 часа
  refresh-expiration: 604800000     # 7 дней